name: Android debug APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify location sharing and RejHub sessions
        run: |
          npm install --prefix /tmp/rejtag-test @electric-sql/pglite@0.5.16 --no-audit --no-fund
          node scripts/test-live-schema.mjs
          node scripts/test-rejhub-accounts.mjs
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RejTag-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
