name: Android debug APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify location sharing and RejHub sessions
        run: |
          npm install --prefix /tmp/rejtag-test @electric-sql/pglite@0.5.16 --no-audit --no-fund
          node scripts/test-live-schema.mjs
          node scripts/test-rejhub-accounts.mjs
      - name: Build debug APK
        shell: bash
        run: |
          set +e
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' > "$RUNNER_TEMP/sdk.log" 2>&1
            if [ $? -ne 0 ]; then
              tail -20 "$RUNNER_TEMP/sdk.log" | while IFS= read -r line; do echo "::error::$line"; done
              exit 1
            fi
          fi
          ./gradlew assembleDebug --stacktrace > "$RUNNER_TEMP/gradle.log" 2>&1
          result=$?
          if [ "$result" -ne 0 ]; then
            sed -n '/^\* What went wrong:/,/^\* Try:/p' "$RUNNER_TEMP/gradle.log" | head -9 | while IFS= read -r line; do echo "::error::$line"; done
            tail -30 "$RUNNER_TEMP/gradle.log"
          fi
          exit "$result"
      - uses: actions/upload-artifact@v4
        with:
          name: RejTag-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
