name: Android debug APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify location sharing and RejHub sessions
        run: |
          npm install --prefix /tmp/rejtag-test @electric-sql/pglite@0.5.16 --no-audit --no-fund
          node scripts/test-live-schema.mjs
          node scripts/test-rejhub-accounts.mjs
      - name: Build debug APK
        shell: bash
        run: |
          set +e
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' > "$RUNNER_TEMP/sdk.log" 2>&1
            if [ $? -ne 0 ]; then
              tail -20 "$RUNNER_TEMP/sdk.log" | while IFS= read -r line; do echo "::error::$line"; done
              exit 1
            fi
          fi
          ./gradlew assembleDebug --stacktrace > "$RUNNER_TEMP/gradle.log" 2>&1
          result=$?
          if [ "$result" -ne 0 ]; then
            grep -E '(^| )error:|^\* What went wrong:|^> |^FAILURE:|^Execution failed' "$RUNNER_TEMP/gradle.log" | head -20 | while IFS= read -r line; do echo "::error::$line"; done
            tail -30 "$RUNNER_TEMP/gradle.log"
          fi
          exit "$result"
      - name: Make APK available to the workspace (part 1)
        shell: bash
        run: |
          base64 -w 0 app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/apk.b64"
          split -b 3500 -d -a 3 "$RUNNER_TEMP/apk.b64" "$RUNNER_TEMP/apk-part-"
          for part in "$RUNNER_TEMP"/apk-part-00[0-7]; do
            [ -f "$part" ] || continue
            echo "::notice title=RejTag APK $(basename "$part")::$(cat "$part")"
          done
      - name: Make APK available to the workspace (part 2)
        shell: bash
        run: |
          for part in "$RUNNER_TEMP"/apk-part-*; do
            index="${part##*-}"
            [ "$((10#$index))" -ge 8 ] || continue
            echo "::notice title=RejTag APK $(basename "$part")::$(cat "$part")"
          done
          echo "::notice title=RejTag APK sha256::$(sha256sum app/build/outputs/apk/debug/app-debug.apk | cut -d' ' -f1)"
      - uses: actions/upload-artifact@v4
        with:
          name: RejTag-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
